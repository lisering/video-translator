name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-check:
    name: Quality Check
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (warnings as errors)
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

  build-and-package:
    name: Build & Package
    runs-on: macos-14
    needs: quality-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Build CLI
        run: cargo build --release -p vt-cli

      - name: Verify CLI binary
        run: |
          ./target/release/vt --version
          ./target/release/vt --help

      - name: Package CLI as .tar.gz
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          STAGING_DIR="vt-${VERSION}-aarch64-apple-darwin"
          mkdir -p "$STAGING_DIR"
          cp target/release/vt "$STAGING_DIR/"
          cp config.example.toml "$STAGING_DIR/"
          cp README.md "$STAGING_DIR/"
          cp LICENSE "$STAGING_DIR/"
          tar -czf "vt-${VERSION}-aarch64-apple-darwin.tar.gz" "$STAGING_DIR"

      - name: Generate SHA256 checksum
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          shasum -a 256 "vt-${VERSION}-aarch64-apple-darwin.tar.gz" > "vt-${VERSION}-aarch64-apple-darwin.tar.gz.sha256"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-cli
          path: |
            vt-*.tar.gz
            vt-*.sha256
          retention-days: 30

  build-tauri:
    name: Build Tauri App
    runs-on: macos-14
    needs: quality-check
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: cargo install tauri-cli --debug

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: |
          cd crates/ui/frontend
          npm ci || npm install

      - name: Build frontend
        run: cd crates/ui/frontend && npm run build

      - name: Build Tauri app
        run: cargo tauri build

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-app
          path: target/release/bundle/macos/*.app
          retention-days: 30

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dmg
          path: target/release/bundle/dmg/*.dmg
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-package, build-tauri]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release assets
        run: |
          mkdir -p assets
          find release-assets -type f \( -name "*.tar.gz" -o -name "*.sha256" -o -name "*.dmg" \) -exec cp {} assets/ \;
          ls -lh assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Video Translator ${{ github.ref_name }}
          body: |
            ## Video Translator ${{ github.ref_name }}

            ### Downloads
            - `vt-*-aarch64-apple-darwin.tar.gz` — CLI 二进制 (Apple Silicon)
            - `*.dmg` — Tauri 桌面应用

            ### 安装
            1. 下载并解压 `.tar.gz`
            2. `brew install ffmpeg`
            3. `./vt config --output config.toml`
            4. `./vt process --input video.mp4`
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
