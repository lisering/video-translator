[package]
name = "vt-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for Video Translator — English IT video to Chinese dubbing"

[features]
default = ["diarization", "checkpoint", "batch"]
cloning = []
profiling = []
diarization = []
checkpoint = []
batch = []
# Kokoro-82M ONNX 推理支持（需下载模型 + ONNX Runtime）
# 启用方式: cargo build --features kokoro-onnx
kokoro-onnx = ["dep:ort"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
whisper-rs = { workspace = true }
hound = { workspace = true }
ureq = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
md5 = "0.7"
hex = "0.4"
uuid = { workspace = true }
rayon = { workspace = true }
once_cell = { workspace = true }
async-channel = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
sysinfo = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
# Random number generation for TTS sampling (MOSS-TTS module)
rand = "0.9"
# ONNX Runtime for Kokoro-82M inference (optional)
# 启用方式: cargo build --features kokoro-onnx
ort = { version = "2.0.0-rc.13", optional = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "pipeline_bench"
harness = false

[[bench]]
name = "translation_accuracy"
harness = false

[[bench]]
name = "asr_bench"
harness = false

[[bench]]
name = "tts_bench"
harness = false

[[bench]]
name = "translate_bench"
harness = false

[[bench]]
name = "tts_speed_bench"
harness = false

[[bench]]
name = "voice_clone_bench"
harness = false
